version: 2

models:
  - name: int_identity_unioned
    description: Union of all three staging models. One row per candidate per system.
    columns:
      - name: candidate_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: source_system
        tests:
          - not_null
          - accepted_values:
              values: ['crm', 'ats', 'srv']

  - name: int_identity_deduped
    description: >
      Deduplicated to one row per candidate. Uses most-recent-non-null
      conflict resolution. System flags indicate which products the
      candidate appears in.
    columns:
      - name: candidate_id
        tests: [unique, not_null]
      - name: email
        tests:
          - not_null
          - email_format
      - name: customer_id
        tests: [not_null]
