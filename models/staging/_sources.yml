# models/staging/_sources.yml
version: 2

sources:
  - name: raw
    database: raw
    schema: public
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: _etl_loaded_at   # if your pipeline stamps this

    tables:
      - name: crm_candidates
        columns:
          - name: candidate_id
            tests: [unique, not_null]
          - name: customer_id
            tests: [not_null]
          - name: email
            tests: [not_null]

      - name: ats_candidates
        columns:
          - name: candidate_id
            tests: [unique, not_null]
          - name: job_id
            tests: [not_null]

      - name: ats_jobs
        columns:
          - name: job_id
            tests: [unique, not_null]
          - name: customer_id
            tests: [not_null]

      - name: srv_applicants
        columns:
          - name: candidate_id
            tests: [unique, not_null]
          - name: customer_id
            tests: [not_null]
