name: dbt parse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    env:
      # parse never connects; dummy values satisfy env_var() in profiles.yml
      SNOWFLAKE_ACCOUNT: ci
      SNOWFLAKE_USER: ci
      SNOWFLAKE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt deps --profiles-dir .
      - run: dbt parse --profiles-dir .
      - name: List models, tests and unit tests
        run: dbt ls --profiles-dir . --resource-type model test unit_test
